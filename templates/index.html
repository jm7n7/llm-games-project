{% extends "base.html" %}

{% block content %}
<!-- Left Panel: Game Board -->
<div class="left-panel">
    <div class="board-wrapper" id="board-container">
        <!-- AI Reasoning Dialog (New Position - Reverted) -->
        <div id="ai-reasoning-modal" class="ai-reasoning-container hidden">
            <div class="ai-avatar">🤖</div>
            <div class="ai-text" id="ai-reasoning-text">Thinking...</div>
            <button id="close-reasoning-btn" class="close-btn">&times;</button>
        </div>

        <!-- Board will be generated by JS here -->
        <div class="chess-board" id="chess-board">
            <!-- Squares will be injected here -->
        </div>

        <!-- Promotion Modal (Hidden by default) -->
        <div id="promotion-modal" class="promotion-modal hidden">
            <div class="promotion-content">
                <h3>Choose Promotion</h3>
                <div class="promotion-options">
                    <button class="promo-btn" data-piece="Queen">♕ Queen</button>
                    <button class="promo-btn" data-piece="Rook">♖ Rook</button>
                    <button class="promo-btn" data-piece="Bishop">♗ Bishop</button>
                    <button class="promo-btn" data-piece="Knight">♘ Knight</button>
                </div>
            </div>
        </div>

        <!-- Game Over Modal (Hidden by default) -->
        <div id="game-over-modal" class="promotion-modal hidden">
            <div class="promotion-content">
                <h3 id="game-over-title">Game Over</h3>
                <p id="game-over-message" style="margin-bottom: 20px; color: var(--text-secondary);"></p>
                <div style="display: flex; gap: 10px; justify-content: center;">
                    <button class="btn-primary" id="modal-new-game-btn">Play Again</button>
                    <button class="btn-primary" id="modal-analyze-btn"
                        style="background-color: var(--accent-primary);">Analyze Game 🧠</button>
                </div>
            </div>
        </div>

        <!-- Analysis Modal -->
        <div id="analysis-modal" class="promotion-modal hidden">
            <div class="promotion-content" style="max-width: 600px; text-align: left;">
                <h3 style="text-align: center;">Coach Joey's Game Report 📝</h3>
                <div id="analysis-content"
                    style="max-height: 60vh; overflow-y: auto; white-space: pre-wrap; margin-bottom: 20px; color: var(--text-secondary); font-size: 0.95rem; line-height: 1.5;">
                </div>
                <div style="text-align: center;">
                    <button class="btn-primary" id="close-analysis-btn">Close</button>
                </div>
            </div>
        </div>

        <!-- Intervention Modal (Dedicated) -->
        <div id="intervention-modal" class="promotion-modal hidden">
            <div class="promotion-content">
                <h3 id="intervention-title">Wait! Coach Intervention 🛑</h3>
                <p id="intervention-message" style="margin-bottom: 20px; color: var(--text-secondary);"></p>
                <div style="display: flex; justify-content: center; gap: 10px;">
                    <button class="btn-primary" id="intervention-ignore-btn">Ignore & Continue</button>
                    <button class="btn-primary" id="intervention-undo-btn" style="background-color: #555;">Take Back
                        Move</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Right Panel: Info & Chat -->
<div class="right-panel">
    <div class="panel-header">
        <h1>RooChess AI</h1>
        <div class="game-info">
            <span id="turn-indicator" class="fade-text">Waiting for game...</span>
            <span id="game-status" class="fade-text"></span>
        </div>
    </div>

    <div class="active-game-controls">
        <div class="color-selection">
            <label class="radio-label">
                <input type="radio" name="playerColor" value="white" checked> White
            </label>
            <label class="radio-label">
                <input type="radio" name="playerColor" value="black"> Black
            </label>
        </div>

        <div class="color-selection">
            <label class="radio-label">
                <input type="radio" name="skillLevel" value="beginner" checked> Beginner
            </label>
            <label class="radio-label">
                <input type="radio" name="skillLevel" value="intermediate"> Intermediate
            </label>
            <label class="radio-label">
                <input type="radio" name="skillLevel" value="advanced"> Advanced
            </label>
        </div>
        <button class="btn-primary" id="new-game-btn" style="width: 100%;">New Game</button>
    </div>

    <h3>Coach Joey</h3>
    <div class="coach-container" id="chat-history">
        <div class="chat-message message-coach">
            Welcome to RooChess! Start a new game to begin.
        </div>
    </div>

    <div class="input-area">
        <input type="text" class="chat-input" id="user-input" placeholder="Ask the coach...">
        <button class="btn-primary" id="send-btn">Send</button>
    </div>
</div>
{% endblock %}
